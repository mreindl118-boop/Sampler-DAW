name: SoundLABStudio
options:
  xcodeVersion: '15.4'
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.soundlab.studio
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  SoundLABStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Web
        type: folder
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SoundLAB Studio
        NSBluetoothAlwaysUsageDescription: Connect your MIDI keyboard wirelessly to play SoundLAB and control its key lights.
        NSMicrophoneUsageDescription: Record audio from your microphone or connected audio input into SoundLAB tracks and samples.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: WebKit.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreAudioKit.framework
      - sdk: AudioToolbox.framework
schemes:
  SoundLABStudio:
    build:
      targets:
        SoundLABStudio: all
    run:
      config: Debug
    archive:
      config: Release
